name: RequestTimeout Repository Policy

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install deps
        run: pip install requests

      - name: Check repository policy
        env:
          ADMIN_PAT: ${{ secrets.ADMIN_PAT }}
        run: python .github/scripts/check_repo.py
