name: RequestTimeout Repository Policy

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - run: pip install requests

      - run: python scripts/check_repo.py
        env:
          ADMIN_PAT: ${{ secrets.ADMIN_PAT }}
